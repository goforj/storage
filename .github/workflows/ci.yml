name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "stable"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Check every module
        run: scripts/check-quality.sh

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run integration tests
        run: |
          cd integration
          go test -tags=integration -count=1 -v ./all

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            .github/cache-keys/coverage-go.txt
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run combined coverage
        run: scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
