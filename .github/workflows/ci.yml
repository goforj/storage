name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (${{ matrix.module }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "stable"]
        module:
          - "."
          - storagecore
          - storagetest
          - driver/dropboxstorage
          - driver/ftpstorage
          - driver/gcsstorage
          - driver/localstorage
          - driver/memorystorage
          - driver/rclonestorage
          - driver/redisstorage
          - driver/s3storage
          - driver/sftpstorage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Verify module quality
        working-directory: ${{ matrix.module }}
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...

      - name: Verify published dependency compatibility
        working-directory: ${{ matrix.module }}
        run: GOWORK=off go test -run '^$' -count=1 ./...

  repository:
    name: Repository support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Verify published module manifests
        run: scripts/check-published-modules.sh

      - name: Verify examples
        working-directory: examples
        run: |
          go mod tidy -diff
          GOWORK=off go vet ./...
          GOWORK=off go test -count=1 ./...

      - name: Verify integration compilation
        working-directory: integration
        run: |
          go mod tidy -diff
          go vet -tags=integration ./...
          go test -tags=integration -run '^$' -count=1 ./...

      - name: Verify benchmark compilation
        working-directory: docs/bench
        run: |
          go mod tidy -diff
          go vet -tags=bench ./...
          go vet -tags=benchrender ./...
          go test -race -tags=bench -run '^$' -count=1 ./...
          go test -race -tags=benchrender -run '^$' -count=1 ./...

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run integration tests
        run: |
          cd integration
          go test -tags=integration -count=1 -v ./all

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true
          cache-dependency-path: |
            .github/cache-keys/coverage-go.txt
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run combined coverage
        run: scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
