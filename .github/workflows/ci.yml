name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.module }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: '.', go-version: '1.24.4' }
          - { module: storagecore, go-version: '1.24.4' }
          - { module: driver/dropboxstorage, go-version: '1.24.4' }
          - { module: driver/ftpstorage, go-version: '1.24.4' }
          - { module: driver/localstorage, go-version: '1.24.4' }
          - { module: driver/memorystorage, go-version: '1.24.4' }
          - { module: driver/redisstorage, go-version: '1.24.4' }
          - { module: driver/s3storage, go-version: '1.24.4' }
          - { module: driver/gcsstorage, go-version: '1.25.0' }
          - { module: storagetest, go-version: '1.25.0' }
          - { module: docs/bench, go-version: '1.26.0' }
          - { module: driver/rclonestorage, go-version: '1.26.0' }
          - { module: driver/sftpstorage, go-version: '1.26.0' }
          - { module: examples, go-version: '1.26.0' }
          - { module: integration, go-version: '1.26.0' }

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Verify module quality
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: off
          GOTOOLCHAIN: local
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...

      - name: Verify published dependency compatibility
        working-directory: ${{ matrix.module }}
        run: GOWORK=off GOTOOLCHAIN=local go test -run '^$' -count=1 ./...

  repository:
    name: Repository support
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Verify published module manifests
        run: scripts/check-published-modules.sh

      - name: Scan all modules
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          PATH="$RUNNER_TEMP/bin:$PATH" bash scripts/govulncheck-all-modules.sh

      - name: Verify examples
        working-directory: examples
        run: |
          go mod tidy -diff
          GOWORK=off go vet ./...
          GOWORK=off go test -count=1 ./...

      - name: Verify integration compilation
        working-directory: integration
        run: |
          go mod tidy -diff
          go vet -tags=integration ./...
          go test -tags=integration -run '^$' -count=1 ./...

      - name: Verify benchmark compilation
        working-directory: docs/bench
        run: |
          go mod tidy -diff
          go vet -tags=bench ./...
          go vet -tags=benchrender ./...
          go test -race -tags=bench -run '^$' -count=1 ./...
          go test -race -tags=benchrender -run '^$' -count=1 ./...

  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: |
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run integration tests
        run: |
          cd integration
          go test -tags=integration -count=1 -v ./all

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: |
            .github/cache-keys/coverage-go.txt
            go.sum
            docs/bench/go.mod
            docs/bench/go.sum
            storagecore/go.mod
            driver/*/go.mod
            examples/go.mod
            examples/go.sum
            integration/go.mod
            integration/go.sum
            storagetest/go.mod
            storagetest/go.sum
            driver/*/go.sum

      - name: Run combined coverage
        run: scripts/coverage-codecov.sh

      - name: Upload results to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          files: coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
