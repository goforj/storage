version: 2
# Root go.work updates synchronize unrelated module graphs and can raise their
# Go minimums. Update nested modules independently; release tooling owns the
# root module's sole dependency on storagecore.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  # These modules retain Go 1.24.4.
  - package-ecosystem: gomod
    directories:
      - /driver/ftpstorage
      - /driver/memorystorage
      - /driver/s3storage
      - /storagecore
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      go1244-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    # Higher releases require Go 1.25 or newer.
    ignore:
      - dependency-name: golang.org/x/sys
        versions: [">=0.42.0"]
      - dependency-name: golang.org/x/text
        versions: [">=0.35.0"]
      - dependency-name: golang.org/x/tools
        versions: [">=0.43.0"]
  # These modules retain Go 1.25.0.
  - package-ecosystem: gomod
    directories:
      - /driver/dropboxstorage
      - /driver/localstorage
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      go1250-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
    # oauth2 v0.37.0 requires Go 1.26; keep the Dropbox driver on Go 1.25.
    ignore:
      - dependency-name: golang.org/x/oauth2
        versions: [">=0.37.0"]
      - dependency-name: golang.org/x/sys
        versions: [">=0.48.0"] # Requires Go 1.26.
  # These modules retain Go 1.26.0.
  - package-ecosystem: gomod
    directories:
      - /docs/bench
      - /driver/gcsstorage
      - /driver/rclonestorage
      - /driver/redisstorage
      - /driver/sftpstorage
      - /examples
      - /integration
      - /storagetest
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      go1260-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /.github/fixtures/minio
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      security-fixes:
        applies-to: security-updates
        patterns: ["*"]
      test-image-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
