name: storage-backup-demo

services:
  minio:
    image: goforj-storage-minio-test:2025-10-15
    build: ../../.github/fixtures/minio
    command: ["server", "/data"]
    ports:
      - "127.0.0.1:19000:9000"
    environment:
      MINIO_ROOT_USER: storage-demo
      MINIO_ROOT_PASSWORD: storage-demo-password
